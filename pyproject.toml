[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "numbr"
version = "3.0.0"
description = "Parse, diagnose, batch-convert, extract, and normalize English numbers, exact decimals, scientific and accounting notation, and Roman numerals."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "DOYDL Technologies" },
]
keywords = ["numbers", "nlp", "decimals", "scientific-notation", "accounting", "diagnostics", "batch-conversion", "normalization", "ordinals", "parser", "roman-numerals"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=7.4",
  "ruff>=0.9",
  "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/doydl-technologies/numbr"
Documentation = "https://github.com/doydl-technologies/numbr#readme"
Issues = "https://github.com/doydl-technologies/numbr/issues"
Changelog = "https://github.com/doydl-technologies/numbr/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/numbr"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
line-ending = "lf"
